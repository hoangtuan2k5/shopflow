spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: shopflow-backend
  profiles:
    default: dev
  jackson:
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: shopflow
  flyway:
    enabled: true
    schemas: shopflow
    default-schema: shopflow

server:
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: strict

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

shopflow:
  r2:
    endpoint: ${R2_ENDPOINT:http://localhost:9}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    bucket: ${R2_BUCKET:dev-products}
    public-base-url: ${R2_PUBLIC_BASE_URL:https://media.example.invalid}
  openapi:
    version: 0.0.1-SNAPSHOT

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
