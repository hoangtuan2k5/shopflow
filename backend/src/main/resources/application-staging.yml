spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

# Tài liệu API là bản đồ tấn công miễn phí. Tắt hẳn thay vì chặn bằng luật bảo mật:
# endpoint đã tắt thì không thể cấu hình nhầm thành mở.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

shopflow:
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET}
    public-base-url: ${R2_PUBLIC_BASE_URL}
